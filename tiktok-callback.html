<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Login – Shorts Pipeline</title><link rel="stylesheet" href="style.css">
<meta name="robots" content="noindex"></head>
<body>
<h1>TikTok login</h1>
<p id="status">Reading the authorization result…</p>
<p>Copy this code into the terminal where the setup script is waiting:</p>
<pre id="code" style="padding:12px;border:1px solid #888;word-break:break-all;white-space:pre-wrap">–</pre>
<script>
  // Zeigt nur den Code aus der URL an; nichts wird gespeichert oder gesendet.
  var params = new URLSearchParams(window.location.search);
  var code = params.get("code");
  var error = params.get("error_description") || params.get("error");
  document.getElementById("status").textContent = code
    ? "Authorization succeeded."
    : (error ? "Authorization failed: " + error : "No code in the URL.");
  if (code) document.getElementById("code").textContent = code;
</script>

</body>
</html>
